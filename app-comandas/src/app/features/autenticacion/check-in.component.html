<ion-content [fullscreen]="true" class="checkin-content">

  <!-- Fondo con gradiente animado -->
  <div class="checkin-bg" aria-hidden="true">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
  </div>

  <!-- Botón dark mode (esquina superior derecha) -->
  <button class="btn-theme-top" (click)="settings.toggleDark()" [attr.aria-label]="settings.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'">
    <ion-icon [name]="settings.isDark() ? 'sunny-outline' : 'moon-outline'"></ion-icon>
  </button>

  <!-- Contenido principal -->
  <div class="checkin-container">

    <!-- HERO: Logo + Headline -->
    <header class="checkin-hero" aria-label="Bienvenida">
      <div class="logo-badge">
        <ion-icon name="restaurant-outline" aria-hidden="true"></ion-icon>
      </div>
      <h1 class="headline">
        Trace<span class="headline--dot">.</span>
      </h1>
      <p class="subheadline">{{ 'CHECKIN.SUBHEADLINE' | translate }}</p>
    </header>

    <!-- FORMULARIO -->
    <section class="checkin-form" aria-label="Formulario de acceso">

      <!-- Campo Nombre -->
      <div class="field-group" [class.field-group--error]="errorNombre()">
        <label class="field-label" for="input-nombre">{{ 'CHECKIN.NOMBRE_LABEL' | translate }}</label>
        <div class="field-wrapper">
          <ion-icon name="person-outline" class="field-icon" aria-hidden="true"></ion-icon>
          <input
            id="input-nombre"
            type="text"
            class="field-input"
            [placeholder]="'CHECKIN.NOMBRE_PLACEHOLDER' | translate"
            [(ngModel)]="nombre"
            (ngModelChange)="onNombreChange()"
            autocomplete="given-name"
            autocapitalize="words"
          >
        </div>
        @if (errorNombre()) {
          <p class="field-error" role="alert" aria-live="polite">
            <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
            {{ errorNombre() }}
          </p>
        }
      </div>

      <!-- Campo Mesa -->
      <div class="field-group" [class.field-group--error]="errorMesa()" [class.field-group--locked]="mesaDesdeQR">
        <label class="field-label" for="input-mesa">{{ 'CHECKIN.MESA_LABEL' | translate }}</label>
        <div class="field-wrapper">
          <ion-icon [name]="mesaDesdeQR ? 'lock-closed-outline' : 'scan-outline'" class="field-icon" aria-hidden="true"></ion-icon>
          <input
            id="input-mesa"
            type="number"
            class="field-input"
            [placeholder]="'CHECKIN.MESA_PLACEHOLDER' | translate"
            [(ngModel)]="mesaId"
            (ngModelChange)="onMesaChange()"
            [readonly]="mesaDesdeQR"
            inputmode="numeric"
          >
          @if (mesaDesdeQR) {
            <span class="field-badge-qr" aria-label="Mesa asignada automáticamente por QR">
              <ion-icon name="qr-code-outline" aria-hidden="true"></ion-icon>
              QR
            </span>
          }
        </div>
        @if (errorMesa()) {
          <p class="field-error" role="alert" aria-live="polite">
            <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
            {{ errorMesa() }}
          </p>
        }
      </div>

    </section>

    <!-- ALÉRGENOS -->
    <section class="alergenos-section" aria-label="Selección de alérgenos">
      <div class="alergenos-header">
        <div class="alergenos-dot" aria-hidden="true"></div>
        <h2 class="alergenos-title">{{ 'CHECKIN.ALERGENOS_TITULO' | translate }}</h2>
      </div>
      <p class="alergenos-desc">{{ 'CHECKIN.ALERGENOS_DESC' | translate }}</p>

      <div class="alergenos-grid" role="group" aria-label="Alérgenos">
        @for (item of alergenos; track item.id) {
          <button
            class="alergeno-chip"
            [class.alergeno-chip--activo]="item.activo"
            (click)="toggleAlergeno(item.id)"
            [attr.aria-pressed]="item.activo"
            [attr.aria-label]="((item.activo ? 'ACCIONES.DESACTIVAR' : 'ACCIONES.ACTIVAR') | translate) + ' ' + (item.nombre | translate)"
          >
            <div class="alergeno-icon">
              @if (!item.esSvg) { <ion-icon [name]="item.icono" aria-hidden="true"></ion-icon> }
              @if (item.esSvg)  { <ion-icon [src]="item.icono"  aria-hidden="true"></ion-icon> }
            </div>
            <span class="alergeno-label">{{ item.nombre | translate }}</span>
            @if (item.activo) {
              <div class="alergeno-check" aria-hidden="true">
                <ion-icon name="checkmark-outline"></ion-icon>
              </div>
            }
          </button>
        }
      </div>
    </section>

    <!-- CTA -->
    <div class="checkin-cta">
      <button class="btn-acceder" (click)="acceder()" [attr.aria-label]="'CHECKIN.CTA' | translate">
        <span>{{ 'CHECKIN.CTA' | translate }}</span>
        <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon>
      </button>
    </div>

  </div>

</ion-content>
